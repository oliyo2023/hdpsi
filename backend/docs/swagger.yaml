info:
  contact: {}
paths:
  /inventory:
    get:
      consumes:
      - application/json
      description: 获取库存列表，支持按产品变体和店铺筛选，并支持分页
      parameters:
      - description: 产品变体ID
        in: query
        name: product_variant_id
        type: integer
      - description: 店铺ID
        in: query
        name: store_id
        type: integer
      - description: 页码，默认1
        in: query
        minimum: 1
        name: page
        type: integer
      - description: 每页数量，默认10
        in: query
        maximum: 100
        minimum: 1
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功获取库存列表
          schema:
            allOf:
            - $ref: '#/definitions/models.PaginatedResponse'
            - properties:
                items:
                  items:
                    $ref: '#/definitions/models.Inventory'
                  type: array
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取库存列表
      tags:
      - 库存管理
    post:
      consumes:
      - application/json
      description: 创建新的库存记录，需提供产品变体ID、店铺ID和库存数量
      parameters:
      - description: 库存信息
        in: body
        name: inventory
        required: true
        schema:
          $ref: '#/definitions/models.Inventory'
      produces:
      - application/json
      responses:
        "201":
          description: 创建成功
          schema:
            $ref: '#/definitions/models.Inventory'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: 产品变体或店铺不存在
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "409":
          description: 库存记录已存在
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 创建库存
      tags:
      - 库存管理
  /inventory/{id}:
    delete:
      consumes:
      - application/json
      description: 删除指定ID的库存记录，此操作不可逆
      parameters:
      - description: 库存ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 删除成功
          schema:
            $ref: '#/definitions/models.APIResponse'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: 库存不存在
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 删除库存
      tags:
      - 库存管理
    get:
      consumes:
      - application/json
      description: 根据ID获取库存的详细信息，包括产品变体和店铺信息
      parameters:
      - description: 库存ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功获取库存详情
          schema:
            $ref: '#/definitions/models.Inventory'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: 库存不存在
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 获取库存详情
      tags:
      - 库存管理
    put:
      consumes:
      - application/json
      description: 更新现有库存记录，可以修改库存数量并提供更新原因
      parameters:
      - description: 库存ID
        in: path
        name: id
        required: true
        type: integer
      - description: 库存信息
        in: body
        name: inventory
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            $ref: '#/definitions/models.Inventory'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "404":
          description: 库存不存在
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 更新库存
      tags:
      - 库存管理
  /members:
    get:
      consumes:
      - application/json
      description: 获取会员列表，支持按名称、手机号和等级筛选，并支持分页
      parameters:
      - description: 会员名称（模糊查询）
        in: query
        name: name
        type: string
      - description: 手机号码（模糊查询）
        in: query
        name: phone
        type: string
      - description: 会员等级
        enum:
        - regular
        - silver
        - gold
        - platinum
        - diamond
        in: query
        name: level
        type: string
      - description: 页码，默认1
        in: query
        minimum: 1
        name: page
        type: integer
      - description: 每页数量，默认10
        in: query
        maximum: 100
        minimum: 1
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功获取会员列表
          schema:
            allOf:
            - $ref: '#/definitions/models.PaginatedResponse'
            - properties:
                items:
                  items:
                    $ref: '#/definitions/models.Member'
                  type: array
              type: object
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
