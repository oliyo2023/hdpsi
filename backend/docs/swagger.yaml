      tags:
      - 会员管理
    post:
      consumes:
      - application/json
      description: 创建新的会员，需提供必要的会员信息
      parameters:
      - description: 会员信息
        in: body
        name: member
        required: true
        schema:
          $ref: '#/definitions/models.Member'
      produces:
      - application/json
      responses:
        "201":
          description: 创建成功
          schema:
            allOf:
            - $ref: '#/definitions/models.APIResponse'
