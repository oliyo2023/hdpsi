                  $ref: '#/definitions/models.Member'
              type: object
        "400":
          description: 请求参数错误或手机号已被注册
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/models.ErrorResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/models.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 创建会员
      tags:
      - 会员管理
  /members/{id}:
